name: Package AppImage
description: Package Cerium as AppImage and tar.xz, upload artifacts

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Download build cache
      uses: actions/download-artifact@v4
      with:
        name: build-cache-${{ env.ARCH }}
        path: .github/cache/

    - name: Import build cache
      shell: bash
      run: bash ./.github/scripts/import-cache.sh

    - name: Bundle uBlock Origin and Dark Reader
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y python3-cryptography
        mkdir -p keys && chmod 700 keys
        if [ -n "${CERIUM_UBLOCK_ORIGIN_KEY:-}" ]; then printf '%s\n' "$CERIUM_UBLOCK_ORIGIN_KEY" > keys/ublock_origin.pem; fi
        if [ -n "${CERIUM_DARK_READER_KEY:-}" ]; then printf '%s\n' "$CERIUM_DARK_READER_KEY" > keys/dark_reader.pem; fi
        if [ ! -f keys/ublock_origin.pem ] || [ ! -f keys/dark_reader.pem ]; then
          echo "::warning::Extension signing key secrets are not set; this build gets new extension IDs."
        fi
        python3 utils/bundle_extensions.py --output-dir build/src/out/Default --keys-dir keys

    - name: Package as AppImage with Docker
      shell: bash
      run: bash ./package/docker-package.sh

    - name: List build artifacts
      shell: bash
      run: ls -la build

    - name: Get version info
      id: version
      shell: bash
      run: |
        chromium_version=$(cat ungoogled-chromium/chromium_version.txt)
        ungoogled_revision=$(cat ungoogled-chromium/revision.txt)
        version="${chromium_version}-${ungoogled_revision}"
        echo "version=${version}" >> $GITHUB_OUTPUT
        echo "chromium_version=${chromium_version}" >> $GITHUB_OUTPUT
        echo "ungoogled_revision=${ungoogled_revision}" >> $GITHUB_OUTPUT

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: cerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}-AppImage
        path: build/release/cerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}.AppImage*
        if-no-files-found: error
        compression-level: 0

    - name: Upload tar.xz artifact
      uses: actions/upload-artifact@v4
      with:
        name: cerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}-linux
        path: build/release/cerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}_linux.tar.xz
        if-no-files-found: error
        compression-level: 0
