name: Test macOS packaging

# Runs the publish workflow's packaging (macos/package_dmg.sh: app icon,
# bundled extensions, ad hoc signing, disk image) on ungoogled-chromium-macos's
# latest Apple Silicon release, whose Chromium.app has the same layout as
# Cerium.app. This tests packaging changes in minutes instead of after a full
# build. The extensions are packed with throwaway keys.
on:
  push:
    paths:
      - 'macos/package_dmg.sh'
      - 'macos/sign_app.sh'
      - 'macos/compile_icon.py'
      - 'macos/entitlements/**'
      - 'utils/bundle_extensions.py'
      - 'utils/crx3.py'
      - 'extensions/**'
      - '.github/workflows/test-macos-packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package ungoogled-chromium like Cerium
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"

      - name: Install Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Get ungoogled-chromium for macOS
        run: |
          gh release download --repo ungoogled-software/ungoogled-chromium-macos \
            --pattern '*arm64*.dmg' --dir "$RUNNER_TEMP/upstream"
          dmg="$(ls "$RUNNER_TEMP"/upstream/*.dmg | head -n 1)"
          echo "::notice::Testing with $(basename "$dmg")"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F '\t' '/\/Volumes\// { print $NF; exit }')"
          mkdir -p "$RUNNER_TEMP/test"
          ditto "$mount/Chromium.app" "$RUNNER_TEMP/test/Chromium.app"
          hdiutil detach "$mount"
          shasum -a 256 < "$RUNNER_TEMP/test/Chromium.app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/upstream-icon.sha256"

      - name: Diagnose signing
        continue-on-error: true
        run: |
          set +e
          f="$RUNNER_TEMP/test/Chromium.app/Contents/Frameworks/Chromium Framework.framework/Helpers/chrome_crashpad_handler"
          cp "$f" "$RUNNER_TEMP/crashpad-copy"
          {
            ls -le@ "$f"
            xattr -l "$f"
            file "$f"
            codesign -dvvv "$f" 2>&1 | head -20
            echo "-- re-sign copy:"
            codesign --sign - --force --options=restrict,library,runtime,kill --verbose=4 "$RUNNER_TEMP/crashpad-copy" 2>&1; echo "status $?"
            echo "-- re-sign copy, plain:"
            codesign --sign - --force --verbose=4 "$RUNNER_TEMP/crashpad-copy" 2>&1; echo "status $?"
            echo "-- in place:"
            codesign --sign - --force --verbose=4 "$f" 2>&1; echo "status $?"
          } > "$RUNNER_TEMP/diag.txt" 2>&1
          msg="$(cat "$RUNNER_TEMP/diag.txt")"
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice::$msg"

      - name: Package
        run: macos/package_dmg.sh "$RUNNER_TEMP/test/Chromium.app" "$RUNNER_TEMP/test.dmg"

      - name: Check the disk image
        run: |
          mount="$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/test.dmg" | awk -F '\t' '/\/Volumes\// { print $NF; exit }')"
          app="$mount/Chromium.app"
          resources="$app/Contents/Frameworks/Chromium Framework.framework/Resources"
          ls -la "$mount"
          test -L "$mount/Applications"
          test -f "$mount/How to open Chromium.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          cat "$resources/initial_preferences"
          extensions="$(cd "$resources/bundled_extensions" && ls *.crx | tr '\n' ' ')"
          if cmp -s <(shasum -a 256 < "$app/Contents/Resources/Assets.car") "$RUNNER_TEMP/upstream-icon.sha256"; then
            echo "::error::Assets.car is still upstream's; the Cerium icon was not put in"
            exit 1
          fi
          # The signed app has to start (hardened runtime, entitlements,
          # library validation). It prints the page and exits.
          status=0
          perl -e 'alarm 120; exec @ARGV' "$app/Contents/MacOS/Chromium" --headless=new \
            --no-first-run --user-data-dir="$RUNNER_TEMP/profile" --dump-dom \
            'data:text/html,<title>ok</title>' > "$RUNNER_TEMP/dom.html" 2> "$RUNNER_TEMP/app.log" || status=$?
          if [ "$status" != 0 ] || ! grep -q '<title>ok</title>' "$RUNNER_TEMP/dom.html"; then
            {
              echo "The app exited with status $status. Its output:"
              tail -c 3000 "$RUNNER_TEMP/app.log"
              report="$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -n 1)"
              if [ -n "$report" ]; then
                echo "Crash report $report:"
                grep -E '"(exception|termination|asi|crashed|faultingThread|namespace|indicator|reasons|details)"' "$report" | head -n 30
              fi
            } > "$RUNNER_TEMP/failure.txt" 2>&1
            msg="$(cat "$RUNNER_TEMP/failure.txt")"; msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error::$msg"
            exit 1
          fi
          size="$(du -h "$RUNNER_TEMP/test.dmg" | cut -f 1)"
          echo "::notice::Packaged $size disk image; extensions: $extensions; the signed app starts"
          hdiutil detach "$mount"
