name: Build Cerium for Windows

# x64 (64-bit Intel and AMD) build on GitHub's Windows runners, from
# ungoogled-chromium-windows's workflow. Compiling Chromium takes longer than
# a job may run (6 hours), so the build is split into up to 16 jobs ("stages")
# of 3.5 hours of compiling each: each stage continues the build tree that the
# previous one saved (.github/actions/windows-stage). The build ends with the
# installer and the .zip as the artifact cerium-windows-x64, which "Publish
# Cerium for Windows" (release-windows.yml) then tests on Windows and, only if
# every test passes, publishes in the GitHub release for its version.
#
# A failed or cancelled build continues from its last saved stage: run this
# workflow with resume_run_id set to that run's ID (or re-run its failed jobs).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Run ID of an earlier build that failed or was cancelled, to continue from its last saved stage (empty starts from scratch)
        default: ''
        type: string
      jobs:
        description: Parallel compile jobs (ninja -j); GitHub's Windows runners have 4 CPU cores and 16 GB of memory
        default: '3'
        type: string
      publish:
        description: Publish the build in the GitHub release once it passes the tests
        default: true
        type: boolean

permissions:
  contents: read
  actions: read  # to continue an earlier run's build

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-1:
    name: Build (stage 1)
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Prepare
        uses: ./.github/actions/windows-prepare
      - name: Build
        id: stage
        uses: ./.github/actions/windows-stage
        env:
          # Keys that sign the bundled extensions (their IDs; see the README).
          # The stage that finishes compiling the browser signs them.
          CERIUM_UBLOCK_ORIGIN_KEY: ${{ secrets.CERIUM_UBLOCK_ORIGIN_KEY }}
          CERIUM_DARK_READER_KEY: ${{ secrets.CERIUM_DARK_READER_KEY }}
        with:
          finished: false
          from_artifact: ${{ inputs.resume_run_id != '' }}
          from_run: ${{ inputs.resume_run_id }}
          jobs: ${{ inputs.jobs || '3' }}
          token: ${{ github.token }}

  build-2:
    name: Build (stage 2)
    needs: build-1
    # Once the build is finished, the remaining stages skip their steps on a
    # small Linux runner. (Skipping the jobs instead would skip the publish job
    # as well: GitHub skips jobs whose dependencies were skipped.)
    runs-on: ${{ needs.build-1.outputs.finished == 'true' && 'ubuntu-latest' || 'windows-2022' }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished || needs.build-1.outputs.finished }}
    steps:
      - uses: actions/checkout@v7
        if: needs.build-1.outputs.finished != 'true'
        with:
          submodules: true
      - name: Prepare
        if: needs.build-1.outputs.finished != 'true'
        uses: ./.github/actions/windows-prepare
      - name: Build
        id: stage
        if: needs.build-1.outputs.finished != 'true'
        uses: ./.github/actions/windows-stage
        env:
          # Keys that sign the bundled extensions (their IDs; see the README).
          # The stage that finishes compiling the browser signs them.
          CERIUM_UBLOCK_ORIGIN_KEY: ${{ secrets.CERIUM_UBLOCK_ORIGIN_KEY }}
          CERIUM_DARK_READER_KEY: ${{ secrets.CERIUM_DARK_READER_KEY }}
        with:
          finished: false
          from_artifact: true
          jobs: ${{ inputs.jobs || '3' }}
          token: ${{ github.token }}

  build-3:
    name: Build (stage 3)
    needs: build-2
    runs-on: ${{ needs.build-2.outputs.finished == 'true' && 'ubuntu-latest' || 'windows-2022' }}
    timeout-minutes: 360
