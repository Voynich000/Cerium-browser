name: Publish Cerium for Windows

# Tests a finished Windows build (the artifact cerium-windows-x64 of
# build-windows.yml: the installer and the .zip) on Windows Server 2022 and
# 2025 with windows/test_package.ps1 (install, start, bundled extensions,
# uninstall, the .zip) and, only if every test passes, publishes both in the
# GitHub release for their version (tag included), creating the release if
# there is none and replacing the Windows files if there are.
#
# - "Build Cerium for Windows" runs it when its build is finished.
# - Run it from the Actions tab to test and publish the latest finished build
#   (or the build run given as run_id) again, without building.
on:
  workflow_call:
    inputs:
      run_id:
        description: Run of "Build Cerium for Windows" whose build to test and publish
        required: true
        type: string
      publish:
        description: Publish once the tests pass (otherwise only test)
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the "Build Cerium for Windows" run to publish (empty: the latest finished build)'
        required: false
        type: string
        default: ''
      publish:
        description: Publish once the tests pass (otherwise only test)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read  # to download another run's build

defaults:
  run:
    shell: bash

jobs:
  find:
    name: Find the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      sha: ${{ steps.find.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Find the build
        id: find
        run: |
          if [ -n "$RUN_ID" ]; then
            query="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=cerium-windows-x64&per_page=100"
          else
            query="repos/$GITHUB_REPOSITORY/actions/artifacts?name=cerium-windows-x64&per_page=100"
          fi
          artifact="$(gh api "$query" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last')"
          if [ -z "$artifact" ] || [ "$artifact" = null ]; then
            echo "::error::No finished Windows build found${RUN_ID:+ in run $RUN_ID}. Run \"Build Cerium for Windows\" first."
            exit 1
          fi
          {
            echo "run_id=$(jq -r .workflow_run.id <<< "$artifact")"
            echo "sha=$(jq -r .workflow_run.head_sha <<< "$artifact")"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test on ${{ matrix.os }}
    needs: find
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2022 and 2025: the Windows 10 and Windows 11 code bases
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download the installer and the .zip
        uses: actions/download-artifact@v8
        with:
          name: cerium-windows-x64
          path: packages
          run-id: ${{ needs.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install, start and uninstall Cerium; start it from the .zip
        shell: pwsh
        run: windows/test_package.ps1 -Packages packages

  publish:
    name: Publish in the GitHub release
    needs: [find, test]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    # One release edit at a time (release-macos.yml edits the same notes).
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the installer and the .zip
        uses: actions/download-artifact@v8
        with:
          name: cerium-windows-x64
          path: packages
          run-id: ${{ needs.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish
        env:
          SHA: ${{ needs.find.outputs.sha }}
        run: |
          cd packages
          setup="$(ls cerium-*-x64-windows-setup.exe)"
          zip="$(ls cerium-*-x64-windows.zip)"
          tag="${setup#cerium-}"
          tag="${tag%-x64-windows-setup.exe}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Unexpected installer name $setup"
            exit 1
          fi
          sha256sum "$setup" | tee "$setup.sha256"
          sha256sum "$zip" | tee "$zip.sha256"

          notes="$RUNNER_TEMP/windows-notes.md"
          {
            echo "<!-- cerium-windows -->"
            echo "### Windows (x64)"
            echo
            echo "For 64-bit Windows 10 and 11 on Intel and AMD processors:"
            echo
            echo "- **Installer:** download \`$setup\` and run it. It installs Cerium for your Windows account (no administrator rights needed) and opens it. Cerium is then in the Start menu, and you can uninstall it in **Settings → Apps**."
            echo "- **Without installing:** download \`$zip\`, extract it and run \`chrome.exe\` in the extracted folder. It keeps its settings in the same place as an installed Cerium."
            echo
            echo "Cerium is not signed with a code signing certificate, so Windows may show \"Windows protected your PC\" when you run the installer: click **More info**, then **Run anyway**. Your browser may also ask whether to keep the download: choose **Keep**."
            echo
            echo "SHA-256:"
            echo "- \`$setup\`: \`$(cut -d ' ' -f 1 "$setup.sha256")\`"
            echo "- \`$zip\`: \`$(cut -d ' ' -f 1 "$zip.sha256")\`"
            echo "<!-- /cerium-windows -->"
          } > "$notes"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$setup" "$setup.sha256" "$zip" "$zip.sha256" --clobber
            # Replace this workflow's section of the notes (from an earlier
            # publish) and keep the rest, such as the macOS notes.
            gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/body.md"
            python3 - "$RUNNER_TEMP/body.md" "$notes" <<'EOF'
          import re, sys
          body = open(sys.argv[1]).read().rstrip()
          section = open(sys.argv[2]).read().strip()
          pattern = re.compile(r'<!-- cerium-windows -->.*?<!-- /cerium-windows -->', re.DOTALL)
          if pattern.search(body):
              body = pattern.sub(lambda _: section, body)
          else:
              body = (body + '\n\n' + section).strip()
          open(sys.argv[1], 'w').write(body + '\n')
          EOF
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/body.md"
          else
            gh release create "$tag" "$setup" "$setup.sha256" "$zip" "$zip.sha256" \
              --target "$SHA" --title "Cerium $tag" --notes-file "$notes"
          fi
          echo "::notice::Published $setup and $zip to $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
