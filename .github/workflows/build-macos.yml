name: Build Cerium for macOS

# Apple Silicon (arm64) build. Runs on GitHub's free Apple Silicon runners;
# the build is split into resumable jobs (see build-macos-steps.yml) and can
# take a day or more. It ends with the app as a build artifact; for a version
# tag, release-macos.yml then signs it, packages the .dmg and publishes it.
# Started by hand, it only builds: publish the result with "Publish Cerium for
# macOS" (release-macos.yml).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (Apple Silicon, with Xcode 26)
        default: macos-15
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Cerium for macOS (Apple Silicon)
    uses: ./.github/workflows/build-macos-steps.yml
    with:
      arch: arm64
      os: ${{ inputs.runner || 'macos-15' }}

  release:
    name: Publish the disk image
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-macos.yml
    # The Apple Developer ID and extension key secrets (see the README)
    secrets: inherit
    with:
      run_id: ${{ github.run_id }}
      tag: ${{ github.ref_name }}
