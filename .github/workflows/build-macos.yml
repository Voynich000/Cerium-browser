name: Build Cerium for macOS

# Apple Silicon (arm64) build. Runs on GitHub's free Apple Silicon runners;
# the build is split into resumable jobs (see build-macos-steps.yml) and can
# take a day or more. It ends with the app as a build artifact, which
# "Publish Cerium for macOS" (release-macos.yml) then signs, packages as a .dmg
# and publishes in the GitHub release for its version.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (Apple Silicon, with Xcode 26)
        default: macos-15
        type: string
      resume_run_id:
        description: Run ID of an earlier build that failed, to continue from its last saved state (empty starts from scratch)
        default: ''
        type: string

permissions:
  contents: read
  actions: read  # to continue an earlier run's build

jobs:
  build:
    name: Build Cerium for macOS (Apple Silicon)
    uses: ./.github/workflows/build-macos-steps.yml
    with:
      arch: arm64
      os: ${{ inputs.runner || 'macos-15' }}
      resume_run_id: ${{ inputs.resume_run_id || '' }}
