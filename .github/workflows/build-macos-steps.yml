# Cerium's copy of ungoogled-chromium-macos's building.yml (156.0.8078.47):
# the build is split into resumable jobs that each stay under GitHub's 6 hour
# limit. The harness lives in macos/, so steps run there and artifact paths
# are prefixed with macos/. The last job uploads Cerium.app, not yet signed,
# as the artifact cerium-<version>-<arch>-macos-app; release-macos.yml turns it
# into the disk image.
name: Building Cerium for macOS

defaults:
  run:
    shell: bash
    working-directory: macos

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume_run_id:
        description: Run whose last saved build to continue instead of starting over
        required: false
        type: string
        default: ''


jobs:
  retrieve-resources:
    name: Retrieve resources required for building
    if: ${{ inputs.resume_run_id == '' }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Cleanup Android Related Stuff
        run: sudo rm -rf $ANDROID_HOME
      - name: Copy GitHub specific scripts to git-root folder
        run: cp -va ./ci/. ./
      - name: Prepare Xcode
        run: ./github_prepare_xcode.sh
      - name: Disable Spotlight
        run: sudo mdutil -a -i off
      - name: Setup Python 3.13 (latest for depot_tools to work)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup Environment and Toolchain
        run: ./github_setup_env_toolchain.sh ${{ inputs.arch }} | tee -a github_actions_setup_env_toolchain.log
      - name: Download and unpack required resources
        run: ./github_fetch_resources.sh ${{ inputs.arch }} | tee -a github_actions_retrieve_resources.log
      - name: List resources
        run: ls -la
      - name: Archive resources
        run: ./github_pack_resources.sh | tee -a github_actions_retrieve_resources.log
      - name: Upload resources
        uses: actions/upload-artifact@v7
        with:
          name: cerium_macos_resources_${{ inputs.arch }}
          path: macos/upload_build_resources/

  build_job_01:
    name: Start Building Cerium for macOS
    runs-on: ${{ inputs.os }}
    needs: retrieve-resources
    # Cerium: or continue the build saved by an earlier run (resume_run_id).
    if: ${{ !cancelled() && (needs.retrieve-resources.result == 'success' || inputs.resume_run_id != '') }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Log Start Timestamp
        run: date +%s > ./epoch_job_start.txt
      - name: Cleanup Android Related Stuff
        run: sudo rm -rf $ANDROID_HOME
      - name: Copy GitHub specific scripts to git-root folder
        run: cp -va ./ci/. ./
      - name: Prepare Xcode
        run: ./github_prepare_xcode.sh
      - name: Disable Spotlight
        run: sudo mdutil -a -i off
      - name: Setup Environment and Toolchain
        run: ./github_setup_env_toolchain.sh ${{ inputs.arch }} | tee -a github_actions_setup_env_toolchain.log
      - name: Download resources
        if: ${{ inputs.resume_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: cerium_macos_resources_${{ inputs.arch }}
          path: macos
      - name: Unpack resources
        if: ${{ inputs.resume_run_id == '' }}
        run: ./github_unpack_resources.sh
      - name: List resources
        if: ${{ inputs.resume_run_id == '' }}
        run: ls -la
      - name: Prepare for building
        if: ${{ inputs.resume_run_id == '' }}
        run: ./github_before_build.sh ${{ inputs.arch }} | tee -a github_actions_build_${{ inputs.arch }}.log
      - name: Get the logs of the build to continue
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: macos
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Download the build to continue
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: macos
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Unpack archive of the build to continue
        if: ${{ inputs.resume_run_id != '' }}
        run: ./github_unpack_archive.sh
      - name: Build
        id: build
        run: ./github_build.sh ${{ inputs.arch }} 2>&1 | tee -a github_actions_build_${{ inputs.arch }}.log
      - name: Prepare archive of build as artifact
        id: bake
        run: ./github_prepare_artifacts.sh ${{ inputs.arch }} | tee -a github_actions_upload_${{ inputs.arch }}.log
      - name: Upload part build artifact
        uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: macos/upload_part_build/
          overwrite: true
      - name: Upload logs
        uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: macos/upload_logs/
          overwrite: true
      - name: Upload the app as artifact after build
        if: ${{ steps.build.outputs.status == 'finished' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bake.outputs.artifact_name }}
          path: macos/app_artifact/
          compression-level: 0
          if-no-files-found: error

