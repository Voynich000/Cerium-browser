name: Build Cerium for Linux
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Cerium binaries and AppImage
    strategy:
      matrix:
        arch: [arm64, x86_64]
      max-parallel: 2
      fail-fast: true
    uses: ./.github/workflows/build-steps.yml
    # CERIUM_UBLOCK_ORIGIN_KEY and CERIUM_DARK_READER_KEY sign the bundled extensions
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      runs-on: ubuntu-latest

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
